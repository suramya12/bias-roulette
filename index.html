<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spin for K-pop, Pop &amp; Latin, or Anime, and discover music videos.">
  <meta name="theme-color" content="#07060d">
  <meta property="og:title" content="Bias Roulette">
  <meta property="og:description" content="Spin for K-pop, Pop &amp; Latin, or Anime, and discover music videos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://suramya12.github.io/bias-roulette/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Bias Roulette">
  <meta name="twitter:description" content="Spin for K-pop, Pop &amp; Latin, or Anime, and discover music videos.">
  <script>
    function redirectToKpop() {
      if (/^#(?:roulette|top100|binder)(?:\/|$)/.test(location.hash) || new URLSearchParams(location.search).has('forceVideo')) {
        location.replace(new URL('kpop/' + location.search + location.hash, location.href));
      }
    }
    redirectToKpop();
    addEventListener('hashchange', redirectToKpop);
  </script>
  <title>Bias Roulette</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" as="image" href="landing-art/kpop-bg.webp">
  <link rel="preload" as="image" href="landing-art/poplatin-bg.webp">
  <link rel="preload" as="image" href="landing-art/anime-bg.webp">
  <link rel="stylesheet" href="landing.css">
  <script type="module" src="landing.js"></script>
</head>
<body>
  <canvas class="particles" aria-hidden="true"></canvas>
  <main class="stage">
    <div class="stage-picker">
      <header class="stage-heading">
        <h1 class="wordmark">Bias Roulette</h1>
        <p class="tagline">Spin a wheel. Pull a card. Watch the video.</p>
      </header>
      <div class="cards">
        <a class="stage-card" data-side="kpop" href="kpop/#roulette">
          <div class="card-tilt"><div class="card-flip">
            <div class="card-face">
              <img class="card-scene" src="landing-art/kpop-bg.webp" alt="">
              <img class="card-figure" data-src="landing-art/kpop-fg.webp" decoding="async" alt="">
              <div class="card-copy">
                <h2>K-pop</h2>
                <p>Bias wheels, showdowns and the all-time Top 100</p>
                <p class="stat" hidden></p>
                <span class="enter">Enter <span aria-hidden="true">→</span></span>
              </div>
            </div>
            <div class="card-back" aria-hidden="true">Bias Roulette</div>
          </div></div>
        </a>
        <a class="stage-card" data-side="pop" href="pop/#roulette">
          <div class="card-tilt"><div class="card-flip">
            <div class="card-face">
              <img class="card-scene" src="landing-art/poplatin-bg.webp" alt="">
              <img class="card-figure" data-src="landing-art/poplatin-fg.webp" decoding="async" alt="">
              <div class="card-copy">
                <h2>Pop &amp; Latin</h2>
                <p>Artist roulette and a bilingual Top 100</p>
                <p class="stat" hidden></p>
                <span class="enter">Enter <span aria-hidden="true">→</span></span>
              </div>
            </div>
            <div class="card-back" aria-hidden="true">Bias Roulette</div>
          </div></div>
        </a>
        <a class="stage-card" data-side="anime" href="anime/">
          <div class="card-tilt"><div class="card-flip">
            <div class="card-face">
              <img class="card-scene" src="landing-art/anime-bg.webp" alt="">
              <img class="card-figure" data-src="landing-art/anime-fg.webp" decoding="async" alt="">
              <div class="card-copy">
                <h2>Anime</h2>
                <p>Openings, endings, MVs and film songs</p>
                <p class="stat" hidden></p>
                <span class="enter">Enter <span aria-hidden="true">→</span></span>
              </div>
            </div>
            <div class="card-back" aria-hidden="true">Bias Roulette</div>
          </div></div>
        </a>
        <div class="intro-card card-back" aria-hidden="true" hidden>Bias Roulette</div>
      </div>
      <a class="continue" hidden></a>
    </div>
  </main>
</body>
</html>
